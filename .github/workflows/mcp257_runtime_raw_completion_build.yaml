name: MCP257 runtime raw completion tool dispatch build

on:
  workflow_dispatch:
  push:
    branches: ["experimental"]
    paths:
      - '.github/workflows/mcp257_runtime_raw_completion_build.yaml'
      - 'Android/src/scripts/patch_mcp257_runtime_raw_completion.py'
      - 'Android/src/scripts/patch_mcp257_pre_mcp224_bridge.py'
      - 'Android/src/app/src/main/java/com/google/ai/edge/gallery/customtasks/agentchat/AgentCompletionTextResolver.kt'
      - 'Android/src/app/src/test/java/com/google/ai/edge/gallery/customtasks/agentchat/Mcp257RuntimeRawCompletionRegressionTest.kt'

permissions:
  contents: write
  actions: read

concurrency:
  group: mcp257-runtime-raw-completion
  cancel-in-progress: true

jobs:
  build:
    name: Capture runtime completion test sign publish MCP257
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LOCAL_VERSION_NAME: '1.0.14-mcp.257'
      LOCAL_VERSION_CODE: '357'
      APPLICATION_ID_SUFFIX: '.mcp'
      APK_RELEASE_TAG: 'mcp257-runtime-raw-completion-v1'
      APK_NAME: 'local-agent-plaza-1.0.14-mcp.257.apk'
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout experimental source
        uses: actions/checkout@v4
        with:
          ref: experimental
          fetch-depth: 0

      - name: Verify MCP250 protected boundary
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin golden/mcp-250-product-stable:refs/remotes/origin/golden/mcp-250-product-stable
          test "$(git rev-parse refs/remotes/origin/golden/mcp-250-product-stable)" = '4a4346a199344ac0912984f1f383abedf3b93819'
          git diff --name-status refs/remotes/origin/golden/mcp-250-product-stable...HEAD | tee /tmp/mcp257-source-diff.txt
          ! grep -E 'customtasks/(musicgeneration|visualcreation)/|app/src/main/jniLibs/arm64-v8a/' /tmp/mcp257-source-diff.txt

      - name: Materialize MCP251 through MCP257 and verify real completion plumbing
        shell: bash
        run: |
          set -euxo pipefail
          for p in patch_mcp251_office_skills.py patch_mcp252_office_truth.py patch_mcp253_office_contract.py patch_mcp254_document_conversion.py patch_mcp255_excel_evidence.py patch_mcp256_text_tool_dispatch.py patch_mcp257_runtime_raw_completion.py patch_mcp257_pre_mcp224_bridge.py; do
            python3 -m py_compile "Android/src/scripts/$p"
          done
          cd Android/src
          python3 scripts/patch_mcp251_office_skills.py
          python3 scripts/patch_mcp252_office_truth.py
          python3 scripts/patch_mcp253_office_contract.py
          python3 scripts/patch_mcp254_document_conversion.py
          python3 scripts/patch_mcp255_excel_evidence.py
          python3 scripts/patch_mcp256_text_tool_dispatch.py
          python3 scripts/patch_mcp257_runtime_raw_completion.py
          # MCP224 is still the authoritative owner of the legacy fixed-step block and removes it
          # during Gradle configuration. Restore only its exact pre-patch anchor before that stage.
          python3 scripts/patch_mcp257_pre_mcp224_bridge.py

          VM='app/src/main/java/com/google/ai/edge/gallery/ui/llmchat/LlmChatViewModel.kt'
          LS='app/src/main/java/com/google/ai/edge/gallery/ui/llmchat/LlmChatScreen.kt'
          AS='app/src/main/java/com/google/ai/edge/gallery/customtasks/agentchat/AgentChatScreen.kt'
          AR='app/src/main/java/com/google/ai/edge/gallery/customtasks/agentchat/AgentCompletionTextResolver.kt'

          grep -F 'MCP257_RUNTIME_RAW_COMPLETION' "$VM"
          grep -F 'rawVisibleResult.append(partialResult)' "$VM"
          test "$(grep -F -c 'onCompletedText(rawVisibleResult.toString())' "$VM")" -eq 2
          grep -F 'onCompletedText = onCompletedText' "$VM"

          grep -F 'MCP257_RAW_COMPLETION_CALLBACK' "$LS"
          grep -F 'onGenerateResponseTextCompleted(model, rawText)' "$LS"
          grep -F 'onDone = { onGenerateResponseDone(model) }' "$LS"
          grep -F 'onInterceptPartialResult = onInterceptPartialResult' "$LS"

          grep -F 'MCP257_RUNTIME_RAW_TEXT_AUTHORITY' "$AS"
          grep -F 'AgentCompletionTextResolver.resolve' "$AS"
          grep -F 'rawCompletionTextByModel[model.name] = rawText' "$AS"
          grep -F 'removeCurrentTurnAgentTextMessages' "$AS"
          grep -F 'viewModel = viewModel' "$AS"
          grep -F 'if (currentSteps >= MAX_COMPAT_TOOL_STEPS)' "$AS"
          ! grep -F 'AgentTextToolCallFallback.parse(lastAgentText.content)' "$AS"
          test -s "$AR"

      - name: Checkout stable-diffusion.cpp at MCP250 protected revision
        uses: actions/checkout@v4
        with:
          repository: leejet/stable-diffusion.cpp
          ref: 19bdfe22d255d5b4dff39d449318b9bc5ea2317f
          path: Android/src/app/src/main/cpp/third_party/stable-diffusion.cpp
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare release signing
        shell: bash
        run: |
          set -euxo pipefail
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/local-agent-plaza-release.jks"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/local-agent-plaza-release.jks" >> "$GITHUB_ENV"

      - name: Run runtime completion Office and phone regressions then build release APK
        working-directory: Android/src
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew :app:testReleaseUnitTest \
            --tests 'com.google.ai.edge.gallery.customtasks.agentchat.AgentOfficeTruthGuardTest' \
            --tests 'com.google.ai.edge.gallery.customtasks.agentchat.AgentOfficeMcp253CompatTest' \
            --tests 'com.google.ai.edge.gallery.customtasks.agentchat.AgentDocumentConversionMcp254Test' \
            --tests 'com.google.ai.edge.gallery.customtasks.agentchat.AgentExcelMcp255CompatTest' \
            --tests 'com.google.ai.edge.gallery.customtasks.agentchat.Mcp255WireEvidenceTest' \
            --tests 'com.google.ai.edge.gallery.customtasks.agentchat.Mcp256PhoneToolCallRegressionTest' \
            --tests 'com.google.ai.edge.gallery.customtasks.agentchat.Mcp257RuntimeRawCompletionRegressionTest' \
            --tests '*ToolCall*Test' \
            :app:assembleRelease --stacktrace

      - name: Verify protected runtime boundaries
        shell: bash
        run: |
          set -euxo pipefail
          git diff --exit-code refs/remotes/origin/golden/mcp-250-product-stable -- \
            Android/src/app/src/main/java/com/google/ai/edge/gallery/customtasks/musicgeneration \
            Android/src/app/src/main/java/com/google/ai/edge/gallery/customtasks/visualcreation \
            Android/src/app/src/main/jniLibs/arm64-v8a

      - name: Verify signed MCP257 APK identity Office assets and raw-completion markers
        id: verify
        shell: bash
        run: |
          set -euxo pipefail
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APK='Android/src/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 1)"
          echo "$BADGING" | grep "name='com.localagent.plaza.mcp'"
          echo "$BADGING" | grep "versionCode='357'"
          echo "$BADGING" | grep "versionName='1.0.14-mcp.257'"
          for skill in word-document pdf-document excel-workbook powerpoint-presentation document-convert; do
            unzip -l "$APK" | grep "assets/skills/$skill/SKILL.md"
          done
          mkdir -p "$RUNNER_TEMP/dex"
          unzip -q "$APK" 'classes*.dex' -d "$RUNNER_TEMP/dex"
          grep -a -F 'AgentCompletionTextResolver' "$RUNNER_TEMP"/dex/classes*.dex
          grep -a -F 'chat.runtime_completion_dispatch' "$RUNNER_TEMP"/dex/classes*.dex
          cp "$APK" "$RUNNER_TEMP/$APK_NAME"
          SHA="$(sha256sum "$RUNNER_TEMP/$APK_NAME" | cut -d' ' -f1)"
          echo "$SHA  $APK_NAME" > "$RUNNER_TEMP/$APK_NAME.sha256"
          echo "apk_sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload MCP257 Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-agent-plaza-mcp-257
          path: |
            ${{ runner.temp }}/${{ env.APK_NAME }}
            ${{ runner.temp }}/${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish permanent MCP257 GitHub Release
        shell: bash
        run: |
          set -euxo pipefail
          gh release view "$APK_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$APK_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Local Agent Plaza MCP257 Runtime Raw Completion Dispatch Fix' \
              --notes 'Phone-evidence follow-up after MCP256 still leaked the exact Excel tool-call fixture as final text. MCP257 captures the complete raw LiteRT-LM runtime stream before UI message segmentation, passes that raw completion through normal send and Run again callbacks, explicitly shares the Agent ViewModel, parses runtime-complete text rather than only the last UI ChatMessageText, and removes all current-turn Agent text fragments when dispatching. Existing MCP251-MCP256 Office and wire repairs are preserved.'
          gh release upload "$APK_RELEASE_TAG" "$RUNNER_TEMP/$APK_NAME" "$RUNNER_TEMP/$APK_NAME.sha256" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Write MCP257 result marker
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' > /tmp/mcp257-result.json
          import json, os
          print(json.dumps({
            'schema':'local-agent-plaza.mcp257-runtime-raw-completion-result.v1',
            'run_id':int(os.environ['GITHUB_RUN_ID']),
            'commit_sha':os.environ['GITHUB_SHA'],
            'version_name':os.environ['LOCAL_VERSION_NAME'],
            'version_code':int(os.environ['LOCAL_VERSION_CODE']),
            'package':'com.localagent.plaza.mcp',
            'release_tag':os.environ['APK_RELEASE_TAG'],
            'apk_name':os.environ['APK_NAME'],
            'apk_sha256':'${{ steps.verify.outputs.apk_sha256 }}',
            'root_cause':'MCP256 parsed only the final UI ChatMessageText; runtime output can be segmented or bypassed by UI message lifecycle, so the full textual tool call was not the completion text inspected by Agent dispatch',
            'fix':'capture complete raw runtime stream and plumb it through normal send, continuation, and Run again completion paths before Agent dispatch',
            'apk_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['APK_RELEASE_TAG']}/{os.environ['APK_NAME']}"
          }, ensure_ascii=False, indent=2))
          PY
          content="$(base64 -w0 /tmp/mcp257-result.json)"
          api="repos/${GITHUB_REPOSITORY}/contents/docs/mcp257_runtime_raw_completion_result.json"
          old="$(gh api "$api?ref=experimental" 2>/dev/null || true)"
          sha="$(printf '%s' "$old" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("sha", ""))' 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            gh api --method PUT "$api" -f message='Update MCP257 runtime raw completion build result' -f branch=experimental -f sha="$sha" -f content="$content"
          else
            gh api --method PUT "$api" -f message='Add MCP257 runtime raw completion build result' -f branch=experimental -f content="$content"
          fi

name: MCP259 Excel latency continuation build

on:
  workflow_dispatch:
  push:
    branches: ["experimental"]
    paths:
      - '.github/workflows/mcp259_excel_latency_continuation_build.yaml'
      - 'Android/src/scripts/patch_mcp259_excel_latency_continuation.py'
      - 'Android/src/app/src/test/java/com/google/ai/edge/gallery/customtasks/agentchat/Mcp259ExcelLatencyContinuationRegressionTest.kt'

permissions:
  contents: write
  actions: read

concurrency:
  group: mcp259-excel-latency-continuation
  cancel-in-progress: true

jobs:
  build:
    name: Restore Excel continuation fast path and publish MCP259
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LOCAL_VERSION_NAME: '1.0.14-mcp.259'
      LOCAL_VERSION_CODE: '359'
      APPLICATION_ID_SUFFIX: '.mcp'
      APK_RELEASE_TAG: 'mcp259-excel-latency-continuation-v1'
      APK_NAME: 'local-agent-plaza-1.0.14-mcp.259.apk'
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout experimental source
        uses: actions/checkout@v4
        with:
          ref: experimental
          fetch-depth: 0

      - name: Verify MCP250 protected boundary
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin golden/mcp-250-product-stable:refs/remotes/origin/golden/mcp-250-product-stable
          test "$(git rev-parse refs/remotes/origin/golden/mcp-250-product-stable)" = '4a4346a199344ac0912984f1f383abedf3b93819'
          git diff --name-status refs/remotes/origin/golden/mcp-250-product-stable...HEAD | tee /tmp/mcp259-source-diff.txt
          ! grep -E 'customtasks/(musicgeneration|visualcreation)/|app/src/main/jniLibs/arm64-v8a/' /tmp/mcp259-source-diff.txt

      - name: Materialize MCP251 through MCP259 and prove continuation parity
        shell: bash
        run: |
          set -euxo pipefail
          for p in patch_mcp251_office_skills.py patch_mcp252_office_truth.py patch_mcp253_office_contract.py patch_mcp254_document_conversion.py patch_mcp255_excel_evidence.py patch_mcp256_text_tool_dispatch.py patch_mcp257_runtime_raw_completion.py patch_mcp258_excel_execution_recovery.py patch_mcp259_excel_latency_continuation.py patch_mcp257_pre_mcp224_bridge.py; do
            python3 -m py_compile "Android/src/scripts/$p"
          done
          cd Android/src
          python3 scripts/patch_mcp251_office_skills.py
          python3 scripts/patch_mcp252_office_truth.py
          python3 scripts/patch_mcp253_office_contract.py
          python3 scripts/patch_mcp254_document_conversion.py
          python3 scripts/patch_mcp255_excel_evidence.py
          python3 scripts/patch_mcp256_text_tool_dispatch.py
          python3 scripts/patch_mcp257_runtime_raw_completion.py
          python3 scripts/patch_mcp258_excel_execution_recovery.py
          python3 scripts/patch_mcp259_excel_latency_continuation.py
          # MCP224 remains owner of the legacy fixed-step block and removes it during Gradle config.
          python3 scripts/patch_mcp257_pre_mcp224_bridge.py

          AS='app/src/main/java/com/google/ai/edge/gallery/customtasks/agentchat/AgentChatScreen.kt'
          AT='app/src/main/java/com/google/ai/edge/gallery/customtasks/agentchat/AgentTools.kt'
          TOOLING='app/src/main/java/com/google/ai/edge/gallery/customtasks/agentchat/AgentTooling.kt'
          COORD='app/src/main/java/com/google/ai/edge/gallery/customtasks/agentchat/AgentCompatRuntimeCoordinator.kt'
          TG='app/src/main/java/com/google/ai/edge/gallery/customtasks/agentchat/AgentOfficeTruthGuard.kt'
          OS='app/src/main/java/com/google/ai/edge/gallery/customtasks/agentchat/AgentOfficeDocumentSupport.kt'
          FB='app/src/main/java/com/google/ai/edge/gallery/customtasks/agentchat/AgentTextToolCallFallback.kt'
          VM='app/src/main/java/com/google/ai/edge/gallery/ui/llmchat/LlmChatViewModel.kt'
          MH='app/src/main/java/com/google/ai/edge/gallery/ui/llmchat/LlmChatModelHelper.kt'

          # Preserve the already phone-verified MCP258 functional execution path.
          grep -F 'MCP257_RUNTIME_RAW_COMPLETION' "$VM"
          grep -F 'MCP257_RUNTIME_RAW_TEXT_AUTHORITY' "$AS"
          grep -F 'MCP258_TRUNCATED_TOOL_OBJECT_CLOSE_REPAIR' "$FB"
          grep -F 'MCP258_UNAMBIGUOUS_EXCEL_CREATE' "$TG"
          grep -F '"excel_workbook" -> runOfficeCompatTool(EXCEL_WORKBOOK_SKILL_NAME, arguments)' "$AT"
          grep -F '"xlsx_create" -> createXlsx(context, root, request)' "$OS"
          grep -F 'private fun createXlsx' "$OS"
          grep -F 'writeBytes(' "$OS"

          # MCP259: runtime classification must use the same recoverable parser as dispatch.
          grep -F 'MCP259_RECOVERED_TOOL_CONTINUATION' "$COORD"
          grep -F 'AgentTextToolCallFallback.parse(text)' "$COORD"
          grep -F '.put("tool", recoveredCall.toolName)' "$COORD"
          grep -F 'COMPAT_FRESH_REASON_TOOL_CONTINUATION' "$COORD"
          grep -F 'state.awaitingToolResult = !blocked' "$COORD"

          # MCP206/MCP209 fresh-Conversation continuation path must still reset Conversation, not Engine.
          grep -F 'if (!prepared.requiresFreshConversation)' "$MH"
          grep -F 'resetConversation(' "$MH"
          grep -F 'AgentCompatRuntimeCoordinator.recordContinuationPreparation' "$MH"
          grep -F 'COMPAT_FRESH_REASON_TOOL_CONTINUATION' "$MH"

          # MCP259: Excel CREATE prompt must advertise the minimal non-duplicating envelope.
          grep -F 'MCP259_EXCEL_COMPACT_CREATE_SCHEMA' "$TOOLING"
          grep -F 'sheet_name' "$TOOLING"
          grep -F 'Never duplicate identical rows in both root rows and sheets' "$TOOLING"

      - name: Checkout stable-diffusion.cpp at MCP250 protected revision
        uses: actions/checkout@v4
        with:
          repository: leejet/stable-diffusion.cpp
          ref: 19bdfe22d255d5b4dff39d449318b9bc5ea2317f
          path: Android/src/app/src/main/cpp/third_party/stable-diffusion.cpp
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare release signing
        shell: bash
        run: |
          set -euxo pipefail
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/local-agent-plaza-release.jks"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/local-agent-plaza-release.jks" >> "$GITHUB_ENV"

      - name: Run Excel execution and latency-state regressions and build release APK
        working-directory: Android/src
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew :app:testReleaseUnitTest \
            --tests 'com.google.ai.edge.gallery.customtasks.agentchat.AgentOfficeTruthGuardTest' \
            --tests 'com.google.ai.edge.gallery.customtasks.agentchat.AgentOfficeMcp253CompatTest' \
            --tests 'com.google.ai.edge.gallery.customtasks.agentchat.AgentDocumentConversionMcp254Test' \
            --tests 'com.google.ai.edge.gallery.customtasks.agentchat.AgentExcelMcp255CompatTest' \
            --tests 'com.google.ai.edge.gallery.customtasks.agentchat.Mcp255WireEvidenceTest' \
            --tests 'com.google.ai.edge.gallery.customtasks.agentchat.Mcp256PhoneToolCallRegressionTest' \
            --tests 'com.google.ai.edge.gallery.customtasks.agentchat.Mcp257RuntimeRawCompletionRegressionTest' \
            --tests 'com.google.ai.edge.gallery.customtasks.agentchat.Mcp258ExcelExecutionRecoveryTest' \
            --tests 'com.google.ai.edge.gallery.customtasks.agentchat.Mcp259ExcelLatencyContinuationRegressionTest' \
            --tests '*ToolCall*Test' \
            :app:assembleRelease --stacktrace

      - name: Verify protected runtime boundaries
        shell: bash
        run: |
          set -euxo pipefail
          git diff --exit-code refs/remotes/origin/golden/mcp-250-product-stable -- \
            Android/src/app/src/main/java/com/google/ai/edge/gallery/customtasks/musicgeneration \
            Android/src/app/src/main/java/com/google/ai/edge/gallery/customtasks/visualcreation \
            Android/src/app/src/main/jniLibs/arm64-v8a

      - name: Verify signed MCP259 APK identity Office assets and latency markers
        id: verify
        shell: bash
        run: |
          set -euxo pipefail
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APK='Android/src/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 1)"
          echo "$BADGING" | grep "name='com.localagent.plaza.mcp'"
          echo "$BADGING" | grep "versionCode='359'"
          echo "$BADGING" | grep "versionName='1.0.14-mcp.259'"
          for skill in word-document pdf-document excel-workbook powerpoint-presentation document-convert; do
            unzip -l "$APK" | grep "assets/skills/$skill/SKILL.md"
          done
          mkdir -p "$RUNNER_TEMP/dex"
          unzip -q "$APK" 'classes*.dex' -d "$RUNNER_TEMP/dex"
          grep -a -F 'AgentTextToolCallFallback' "$RUNNER_TEMP"/dex/classes*.dex
          grep -a -F 'payload_unambiguous_create' "$RUNNER_TEMP"/dex/classes*.dex
          grep -a -F 'xlsx_create' "$RUNNER_TEMP"/dex/classes*.dex
          grep -a -F 'tool_continuation' "$RUNNER_TEMP"/dex/classes*.dex
          grep -a -F 'Never duplicate identical rows' "$RUNNER_TEMP"/dex/classes*.dex
          cp "$APK" "$RUNNER_TEMP/$APK_NAME"
          SHA="$(sha256sum "$RUNNER_TEMP/$APK_NAME" | cut -d' ' -f1)"
          echo "$SHA  $APK_NAME" > "$RUNNER_TEMP/$APK_NAME.sha256"
          echo "apk_sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload MCP259 Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-agent-plaza-mcp-259
          path: |
            ${{ runner.temp }}/${{ env.APK_NAME }}
            ${{ runner.temp }}/${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish permanent MCP259 GitHub Release
        shell: bash
        run: |
          set -euxo pipefail
          gh release view "$APK_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$APK_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Local Agent Plaza MCP259 Excel Latency Continuation Fix' \
              --notes 'MCP258 is phone-verified to create the requested XLSX successfully. MCP259 targets the remaining latency regression shown by the 2026-09-08 paired diagnostics: the Excel tool itself took only ~644 ms, yet the post-tool continuation TTFT was ~87.6 s and runtime metrics showed continuation_prepare=0/unavailable with last_fresh_conversation_reason=top_level_user_turn. MCP259 makes the runtime coordinator use the same recovered textual-tool parser as Agent dispatch so every executable recovered Excel call marks awaitingToolResult and its TOOL_RESULT takes the MCP206 fresh tool_continuation Conversation path while reusing the loaded Engine. It also advertises a compact Excel CREATE envelope using rows + sheet_name and forbids duplicating identical rows under both rows and sheets. Device acceptance requires the XLSX to remain successfully created and diagnostics to show last_fresh_conversation_reason=tool_continuation with available/nonzero continuation prepare/reset metrics. Actual latency improvement remains a phone-measured criterion.'
          gh release upload "$APK_RELEASE_TAG" "$RUNNER_TEMP/$APK_NAME" "$RUNNER_TEMP/$APK_NAME.sha256" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Write MCP259 result marker
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' > /tmp/mcp259-result.json
          import json, os
          print(json.dumps({
            'schema':'local-agent-plaza.mcp259-excel-latency-continuation-result.v1',
            'run_id':int(os.environ['GITHUB_RUN_ID']),
            'commit_sha':os.environ['GITHUB_SHA'],
            'version_name':os.environ['LOCAL_VERSION_NAME'],
            'version_code':int(os.environ['LOCAL_VERSION_CODE']),
            'package':'com.localagent.plaza.mcp',
            'release_tag':os.environ['APK_RELEASE_TAG'],
            'apk_name':os.environ['APK_NAME'],
            'apk_sha256':'${{ steps.verify.outputs.apk_sha256 }}',
            'mcp258_phone_execution':'confirmed: XLSX was created and visible in workspace',
            'excel_baseline':{
              'request_total_ms':217073.83,
              'initial_total_generation_ms':84621.01,
              'initial_output_chars':920,
              'tool_exec_ms':643.77,
              'continuation_ttft_ms':87560.16,
              'continuation_prepare_ms_total':0.0,
              'last_continuation_prepare_ms':'unavailable',
              'last_continuation_reset_ms':'unavailable',
              'last_fresh_conversation_reason':'top_level_user_turn',
              'first_callback_2_pss_mb':5369.95,
              'first_callback_2_native_heap_allocated_mb':8320.87
            },
            'network_comparison':{
              'request_total_ms':126484.09,
              'initial_total_generation_ms':20568.96,
              'initial_output_chars':100,
              'tool_exec_ms':7453.74,
              'continuation_ttft_ms':29313.50,
              'continuation_prepare_ms_total':9.99,
              'last_continuation_reset_ms':9.63,
              'last_fresh_conversation_reason':'tool_continuation'
            },
            'root_cause':'dispatch and runtime state classification could disagree for textual tool-call dialects/repairs; an executable Excel call could run while coordinator awaitingToolResult remained false, causing TOOL_RESULT to bypass the MCP206 fresh tool_continuation path. Excel CREATE prompt also encouraged redundant rows+sheets JSON, inflating first-pass decode.',
            'fix':'use AgentTextToolCallFallback in runtime tool-call fingerprinting so executable recovered calls enter tool_continuation state; advertise minimal Excel CREATE as rows+sheet_name without duplicated rows/sheets.',
            'device_acceptance':'XLSX must still be created; diagnostic must report last_fresh_conversation_reason=tool_continuation and available/nonzero continuation prepare/reset metrics. Initial output chars should decrease when the model follows the compact create schema; latency improvement must be measured on phone.',
            'apk_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['APK_RELEASE_TAG']}/{os.environ['APK_NAME']}"
          }, ensure_ascii=False, indent=2))
          PY
          content="$(base64 -w0 /tmp/mcp259-result.json)"
          api="repos/${GITHUB_REPOSITORY}/contents/docs/mcp259_excel_latency_continuation_result.json"
          old="$(gh api "$api?ref=experimental" 2>/dev/null || true)"
          sha="$(printf '%s' "$old" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("sha", ""))' 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            gh api --method PUT "$api" -f message='Update MCP259 Excel latency continuation result' -f branch=experimental -f sha="$sha" -f content="$content"
          else
            gh api --method PUT "$api" -f message='Add MCP259 Excel latency continuation result' -f branch=experimental -f content="$content"
          fi
